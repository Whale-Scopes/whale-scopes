name: Update big moves

on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch: {}     # "Run workflow" button for a manual run

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read SEC filings and update trades.json
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          OPENFIGI_KEY: ${{ secrets.OPENFIGI_KEY }}
        run: node scripts/update.mjs

      - name: Save changes
        run: |
          git config user.name "whale-scopes-bot"
          git config user.email "whale-scopes-bot@users.noreply.github.com"
          git add docs/trades.json
          git diff --cached --quiet || (git commit -m "Update big moves" && git push)
